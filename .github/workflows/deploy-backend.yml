name: Deploy Backend (Render)

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK secret is missing."
            exit 1
          fi
          echo "Triggering Render deploy..."
          response="$(curl -s -w "\n%{http_code}" "$RENDER_DEPLOY_HOOK")"
          body="$(printf "%s" "$response" | sed '$d')"
          status="$(printf "%s" "$response" | tail -n 1)"

          echo "Render HTTP status: $status"
          echo "Render response body: $body"

          if [ "$status" -ge 400 ] || [ -z "$body" ]; then
            echo "Render deploy hook failed."
            exit 1
          fi
